[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bc250-ai-studio"
version = "0.1.0"
description = "Persistent local image queue for a shared Vulkan GPU"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "PyYAML>=6,<7",
  "httpx>=0.28,<1", "Pillow>=11,<13"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
