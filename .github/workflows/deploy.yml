name: Deploy BC-250 AI Studio (disabled)

# The old Studio-only deployment is incompatible with model-control migration.
# Keep the dispatch visible, but fail before checkout, credentials, or SSH.
on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy deployment
        run: |
          echo 'Studio-only deployment is disabled until coordinated deployment is validated.' >&2
          exit 1
