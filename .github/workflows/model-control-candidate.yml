name: Build model-control candidate

# This workflow builds a reviewable artifact only. It never connects to the
# production server or installs the unverified coordinated deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend
        run: |
          python -m pip install 'uv==0.9.13'
          uv sync --locked --extra dev
          uv run pytest -q
          uv run ruff check .
      - name: Check deployment coordination candidates
        run: |
          set -euo pipefail
          for test in \
            scripts/test-assemble-phase-safety.py \
            scripts/test-local-idle-composite.py \
            scripts/test-initial-local-idle.py \
            scripts/test-legacy-backup-idle.py \
            scripts/test-legacy-rollback-manual.py \
            scripts/test-coordinated-migration.py \
            scripts/test-verify-initial-preparation.py \
            scripts/test-pinned-preparation.py
          do
            python "$test"
          done
      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Package coordinated deployment candidate
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/bc250-candidate.XXXXXXXX")
          git archive HEAD | tar -x -C "$stage"
          mkdir -p "$stage/frontend/dist"
          cp -R frontend/dist/. "$stage/frontend/dist/"
          git rev-parse HEAD > "$stage/COMMIT"
          tar -czf "$RUNNER_TEMP/bc250-model-control-candidate.tar.gz" -C "$stage" \
            COMMIT pyproject.toml uv.lock backend config frontend/dist deploy systemd docs scripts
          cd "$RUNNER_TEMP"
          sha256sum bc250-model-control-candidate.tar.gz > bc250-model-control-candidate.sha256
          python "$GITHUB_WORKSPACE/deploy/model-control/verify-release-candidate.py" \
            "$RUNNER_TEMP/bc250-model-control-candidate.tar.gz" \
            "$(cut -d ' ' -f1 bc250-model-control-candidate.sha256)" "$GITHUB_SHA"
      - name: Upload candidate and checksum
        uses: actions/upload-artifact@v4
        with:
          name: bc250-model-control-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bc250-model-control-candidate.tar.gz
            ${{ runner.temp }}/bc250-model-control-candidate.sha256
          if-no-files-found: error
