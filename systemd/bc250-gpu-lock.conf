# tmpfiles.d candidate, installed only as part of the coordinated migration.
# Root controls the directory and file; ai-studio may lock but not replace it.
d /run/bc250-gpu 0750 root ai-studio -
f /run/bc250-gpu/gpu.lock 0660 root ai-studio -
# Separate root-only lock for the model worker's entire lifetime.
f /run/bc250-gpu/model-worker.lock 0600 root root -
