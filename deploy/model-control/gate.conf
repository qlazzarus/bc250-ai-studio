# A separate UID prevents Studio from reading gate administrator/switch credentials.
[Service]
User=ai-gate
Group=ai-gate
WorkingDirectory=/opt/bc250-model-control
EnvironmentFile=/etc/bc250-model-control/gate.env
ExecStart=
ExecStart=/opt/bc250-model-control/.venv/bin/python -I -m uvicorn app.gate:create_gate_app --factory --host 127.0.0.1 --port 8081 --workers 1 --no-access-log
ReadWritePaths=/var/lib/bc250-llm-gate
